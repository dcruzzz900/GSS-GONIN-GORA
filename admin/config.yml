backend:
  name: github
  repo: dcruzzz900/GSS-GONIN-GORA
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "news"
    label: "School News"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "datetime"
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
      - label: "News Content"
        name: "body"
        widget: "markdown"

  - name: "staff"
    label: "Staff Profiles"
    folder: "content/staff"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Full Name"
        name: "name"
        widget: "string"
      - label: "Position"
        name: "position"
        widget: "string"
      - label: "Photograph"
        name: "photo"
        widget: "image"
        required: false
      - label: "Biography"
        name: "body"
        widget: "text"

  - name: "pages"
    label: "Website Pages"
    files:
      - label: "About the School"
        name: "about"
        file: "content/about.md"
        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"
          - label: "Content"
            name: "body"
            widget: "markdown"
